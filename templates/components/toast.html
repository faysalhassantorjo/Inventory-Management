<div class="toast-message px-4 py-3 rounded-md shadow-lg text-sm font-medium flex items-center justify-between border
    {% if message.tags == 'success' %}bg-green-950/80 text-green-300 border-green-800
    {% elif message.tags == 'error' %}bg-red-950/80 text-red-300 border-red-800
    {% elif message.tags == 'warning' %}bg-yellow-950/80 text-yellow-300 border-yellow-800
    {% else %}bg-blue-950/80 text-blue-300 border-blue-800{% endif %}"
    onanimationend="if(event.animationName === 'fadeOut') this.remove()"
    style="animation: fadeOut 0.5s ease-out 3s forwards;">
    {{ message }}
</div>
<style>
    @keyframes fadeOut {
        to { opacity: 0; visibility: hidden; }
    }
</style>
