<!-- Navbar -->
<header class="bg-gray-900 border-b border-gray-800 h-16 flex items-center justify-between px-6 shrink-0">
    <div class="flex items-center gap-3">
        <!-- Mobile menu button -->
        <button @click="sidebarOpen = true" type="button" class="md:hidden p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <h1 class="text-base font-semibold text-gray-100">{% block header_title %}Dashboard{% endblock %}</h1>
    </div>

    <div class="flex items-center gap-3">
        {% if user.is_authenticated %}
        <!-- Notification bell (placeholder) -->
        <button type="button" class="hidden sm:flex p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
        </button>

        <!-- User avatar -->
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
                {{ request.user.username|default:"U"|slice:":1"|upper }}
            </div>
            <span class="hidden sm:block text-sm font-medium text-gray-300">{{ request.user.username }}</span>
        </div>
        {% endif %}
    </div>
</header>
